# codegraph indexing itself, so the tool is exercised on real code.
[project]
root = "."
db_path = ".codegraph/graph.db"

[index]
include = ["src/", "tests/"]
languages = ["python"]
exclude = [
    "**/.venv/**", "**/__pycache__/**", "**/.git/**",
    "**/.codegraph/**", "tests/fixtures/**",
]
max_file_size_kb = 512

[server]
max_results = 50
snippet_max_lines = 40

[bridge]
enabled = false
